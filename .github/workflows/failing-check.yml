name: failing-check

on:
  workflow_dispatch:

jobs:
  breaking-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run breaking check
        run: python check.py
